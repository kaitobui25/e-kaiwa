name: Temporary multilingual hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact multilingual hardening patch
        run: echo '' | base64 -d > /tmp/multilingual_patch.py && python /tmp/multilingual_patch.py
      - name: Install runtime dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -s src/tests/python -p 'test_*.py'
      - name: Browser module tests
        run: node --test src/tests/js/*.test.mjs
      - name: Syntax checks
        shell: bash
        run: |
          python -m compileall -q src/e_kaiwa src/app.py src/tests/system/check_system.py deploy/updater
          for file in src/web/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-multilingual-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden multilingual CJK behavior'
          git push origin HEAD:main
