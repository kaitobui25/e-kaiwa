name: Core checks

on:
  push:
    branches: [main, "refactor/**", "test/**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python core regression tests
        run: python -m unittest discover -s src/tests/python -p "test_*.py"

      - name: Python syntax check
        run: python -m compileall -q src/e_kaiwa src/app.py src/tests/system/check_system.py

      - name: Browser JavaScript syntax check
        run: node --check src/web/live.js
