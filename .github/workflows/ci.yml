name: Core checks

on:
  push:
    branches: [main, "refactor/**", "test/**", "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - name: Install runtime dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Python core regression tests
        run: python -m unittest discover -s src/tests/python -p "test_*.py"

      - name: Browser module tests
        run: node --test src/tests/js/*.test.mjs

      - name: Python syntax check
        run: python -m compileall -q src/e_kaiwa src/app.py src/tests/system/check_system.py deploy/updater

      - name: Browser JavaScript syntax check
        run: |
          for file in src/web/*.js; do
            node --input-type=module --check < "$file"
          done
